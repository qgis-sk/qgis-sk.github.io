name: Sync organizácií zo zdieľanej tabuľky

on:
  schedule:
    - cron: "0 6 1 * *"   # 1. deň v mesiaci o 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stiahnuť tabuľku a prepísať data/organizacie.json
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python3 scripts/sync_organizacie.py
      - name: Commit zmien
        run: |
          git config user.name "qgis-sk-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/organizacie.json; then
            echo "Bez zmien"
          else
            git add data/organizacie.json
            git commit -m "Aktualizácia zoznamu organizácií ($(date -u +%Y-%m-%d))"
            git push
          fi
